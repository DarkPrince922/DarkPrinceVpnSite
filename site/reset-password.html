<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новый пароль — DarkPrince VPN</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0a0e17">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="blobs">
        <div class="blob a"></div>
        <div class="blob b"></div>
    </div>

    <header class="top">
        <div class="wrap">
            <a class="brand" href="/">
                <img src="assets/logo.png" alt="">
                <span>DarkPrince <i>VPN</i></span>
            </a>
        </div>
    </header>

    <main class="auth-wrap">
        <div class="card">
            <h2 id="title" style="text-align:center">Новый пароль</h2>
            <div id="message" class="msg hidden"></div>

            <form id="form">
                <label class="field">
                    <span>Новый пароль (не короче восьми символов)</span>
                    <input type="password" id="password" minlength="8" autocomplete="new-password" required>
                </label>
                <label class="field">
                    <span>Ещё раз</span>
                    <input type="password" id="repeat" minlength="8" autocomplete="new-password" required>
                </label>
                <button class="btn-primary btn-block" id="submit" type="submit">Сохранить пароль</button>
            </form>

            <div id="done" class="hidden" style="text-align:center;margin-top:14px">
                <a class="btn btn-primary" href="/cabinet.html">Войти с новым паролем</a>
            </div>
        </div>
    </main>

    <script type="module" src="js/reset-password.js"></script>
</body>

</html>
