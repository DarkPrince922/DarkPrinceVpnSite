# Вариант для сервера, где 443 порт уже занят nginx (например, им же отдаётся
# кабинет). Положите файл в /etc/nginx/sites-available/darkprince.space,
# сделайте ссылку в sites-enabled и выпустите сертификат:
#
#   certbot --nginx -d darkprince.space -d www.darkprince.space
#
# Замените домен на свой; если API кабинета слушает не 8080 — поправьте
# proxy_pass.

server {
    listen 80;
    listen [::]:80;
    server_name darkprince.space www.darkprince.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name darkprince.space www.darkprince.space;

    # эти две строки допишет certbot
    # ssl_certificate     /etc/letsencrypt/live/darkprince.space/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/darkprince.space/privkey.pem;

    root /srv/darkprince/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # API кабинета: браузер ходит на свой же домен, поэтому CORS не нужен,
    # а адрес кабинета не виден снаружи и не блокируется отдельно.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # приложения: файлы большие, нужна докачка
    location /downloads/ {
        add_header Cache-Control "public, max-age=300";
        add_header Content-Disposition attachment;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    client_max_body_size 1m;
}
