# Конфиг сайта для nginx. Пока здесь только 80-й порт: certbot допишет сюда
# 443, пути к сертификату и переадресацию с http сам. Если начать сразу с
# 443, nginx не запустится — сертификата ещё нет.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/dprince.online
#   sudo ln -s /etc/nginx/sites-available/dprince.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dprince.online

# Кеш и Content-Disposition считаем картами, а не add_header внутри location.
# Так надо из-за правила nginx: свой add_header в location отменяет все
# серверные разом, и страницы остались бы без CSP и защитных заголовков.
# Карты стоят снаружи server — sites-enabled подключается внутри http,
# поэтому это допустимое место для map.

map $uri $dp_cache {
    # Разметка, стили и скрипты меняются вместе и без версий в именах. Без
    # заголовка браузер кеширует их на своё усмотрение, и обновление сайта
    # доезжает до людей когда попало. no-cache не запрещает хранить файл —
    # он требует переспросить: не изменился, значит прилетит пустой 304.
    default            "no-cache";

    # Сборки лежат под неизменными именами, но меняются при каждом релизе.
    # Пять минут — компромисс: докачка успевает, новая версия не залипает.
    ~^/downloads/      "public, max-age=300";

    # Манифест обновлений спрашивают сами приложения. Закешированный манифест
    # означает молчащее обновление при полностью рабочем коде.
    ~^/updates/       "no-store";
}

map $uri $dp_disposition {
    # пустое значение nginx просто не добавляет
    default        "";
    ~^/downloads/  "attachment";
}

server {
    listen 80;
    listen [::]:80;
    server_name dprince.online;

    root /srv/darkprince/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Cache-Control $dp_cache always;
    add_header Content-Disposition $dp_disposition always;

    # API кабинета: браузер ходит на свой же домен, поэтому CORS не нужен,
    # а адрес кабинета не виден снаружи и не блокируется отдельно.
    # Слеш в конце proxy_pass обязателен — он срезает /api из пути.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # приложения: файлы большие, нужна докачка
    location /downloads/ {
        try_files $uri =404;
    }

    # Ссылки из писем приходят без расширения: /verify-email, /reset-password.
    # Без $uri.html nginx ищет такой файл буквально, не находит и отдаёт 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    # Bedolaga принимает вложения поддержки до 10 МБ; оставляем запас на
    # multipart-обвязку, иначе nginx отклонит файл раньше приложения.
    client_max_body_size 12m;
}
